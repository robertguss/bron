[project]
name = "bron"
version = "0.1.0"
description = "Validation, DTS resolution and ingest tools for Bron's data repository"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Robert Guss" }]
requires-python = ">=3.15"
dependencies = [
    "dapytains==1.0.0rc4",
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "jsonschema>=4.26.0",
    "lxml>=6.1.3",
    "pyyaml>=6.0.3",
    "uritemplate>=4.2.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
# Only the one-time GD¹ ingest needs these, so a data repository's CI, which installs
# bron without them, does not. lingua 1.4.2 needs regex<2025, which has no Python 3.15
# wheel and builds from source; its models ship in the wheel, so the version pins them.
convert = [
    "lingua-language-detector==1.4.2",
    "pypdfium2==5.14.0",
]

[project.scripts]
bron = "bron.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bron[convert]",
    "pytest>=9.2",
    "ruff>=0.17.3",
    # ty is pre-1.0 and its rules change between releases: bump deliberately.
    "ty==0.0.96",
    "types-lxml>=2026.2.16",
]

[tool.uv]
# dapytains 1.0.0rc4 pins saxonche==12.9.0, which ships no Python 3.15 wheels.
# 13.1.1 does, and enumerates and extracts passages the same way on our texts.
override-dependencies = ["saxonche==13.1.1"]

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.15"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers"]
